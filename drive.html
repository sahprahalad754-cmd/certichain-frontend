<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drive Verify - CertiChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar"></div>

  <section class="py-4">
    <div class="container">
      <h2 class="mb-1">Verify certificates from Google Drive</h2>
      <p class="text-secondary">Pick certificate PDFs from a Drive folder. Each file is hashed with SHA-256 and checked against the blockchain for validity and legality.</p>
      <div id="dmsg"></div>
      <div id="panel"></div>
      <div id="results"></div>
    </div>
  </section>

  <footer class="certi-foot text-center py-3">
    Developed by Prahalad Sah | 2K24CSUN01189 | Manav Rachna University
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    function esc(t) {
      return String(t).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    const me = getUser();

    // ---------- Navbar ----------
    function renderNav() {
      let links;
      if (!me) links = [["index.html", "Home"], ["verify.html", "Verify Certificate"], ["drive.html", "Drive Verify"], ["login.html", "Login"]];
      else if (me.role === "ADMIN") links = [["admin/dashboard.html", "Dashboard"], ["admin/issue.html", "Issue Certificate"], ["verify.html", "Verify"], ["drive.html", "Drive Verify"], ["history.html", "History"]];
      else if (me.role === "VERIFIER") links = [["verify.html", "Verify"], ["drive.html", "Drive Verify"], ["history.html", "My History"]];
      else links = [["student/dashboard.html", "Dashboard"], ["student/my-certificates.html", "My Certificates"], ["verify.html", "Verify"]];

      let items = "";
      links.forEach(function (l) {
        items += '<li class="nav-item"><a class="nav-link' + (l[0] === "drive.html" ? " active" : "") + '" href="' + l[0] + '">' + l[1] + "</a></li>";
      });
      const right = me
        ? '<span class="text-light small me-3">' + esc(me.name) + " (" + me.role + ')</span><button class="btn btn-outline-light btn-sm" onclick="logoutRoot()">Logout</button>'
        : "";
      document.getElementById("navbar").innerHTML =
        '<nav class="navbar navbar-expand-lg navbar-dark certi-nav"><div class="container">' +
        '<a class="navbar-brand fw-bold" href="index.html">CertiChain</a>' +
        '<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>' +
        '<div class="collapse navbar-collapse" id="menu"><ul class="navbar-nav me-auto">' + items + "</ul>" + right + "</div></div></nav>";
    }
    function logoutRoot() {
      sessionStorage.removeItem("certichainUser");
      window.location.href = "index.html";
    }
    renderNav();

    // ---------- Drive state ----------
    const D = { on: false, sel: {}, extra: [], res: null };

    // Files in the (simulated) Drive folder
    function driveFiles() {
      const certs = DB.get("certificates", []);
      const f = certs.map(function (c) {
        return { name: c.id + "_" + c.type.replace(/\s+/g, "_") + ".pdf", buf: base64ToBuffer(c.fileData) };
      });
      if (certs.length) {
        // an edited copy of the first certificate
        const o = new Uint8Array(base64ToBuffer(certs[0].fileData));
        const t = new Uint8Array(o.length + 16);
        t.set(o);
        t.set(new TextEncoder().encode("\n% edited-later\n"), o.length);
        f.push({ name: certs[0].id + "_edited.pdf", buf: t.buffer });
      }
      // a fake certificate that was never issued
      f.push({ name: "Fake_Degree_Rahul_Mehta.pdf", buf: makeSamplePdf("Degree Certificate - Rahul Mehta - Unknown University - 2026") });
      return f.concat(D.extra);
    }

    function draw() {
      const F = driveFiles();
      let html = "";
      if (!D.on) {
        html = '<div class="card" style="max-width:520px"><div class="card-body"><h5>Step 1: Connect Google Drive</h5>' +
          '<p class="text-secondary small">Read-only access to the folder you choose. (Simulated in this prototype. The real version uses the Google Drive API with OAuth.)</p>' +
          '<button class="btn btn-success" onclick="connect()">Connect Google Drive</button></div></div>';
      } else {
        html = '<div class="card"><div class="card-body"><div class="d-flex justify-content-between flex-wrap gap-2"><div>' +
          '<h5 class="mb-0">Step 2: Choose files</h5>' +
          '<div class="mono-dark">My Drive &gt; Certificates to verify | <span class="text-success">Connected (demo account)</span></div></div>' +
          '<div class="d-flex gap-2 align-items-start"><button class="btn btn-outline-secondary btn-sm" onclick="selectAll()">Select all</button>' +
          '<label class="btn btn-outline-secondary btn-sm mb-0">Add file from device<input type="file" accept="application/pdf" multiple hidden onchange="addFiles(event)"></label></div></div>' +
          '<div class="table-responsive mt-2"><table class="table table-sm align-middle"><thead><tr><th></th><th>Name</th><th>Size</th></tr></thead><tbody>';
        F.forEach(function (f, i) {
          html += '<tr><td><input class="form-check-input" type="checkbox" ' + (D.sel[f.name] ? "checked" : "") + ' onchange="toggle(' + i + ')"></td>' +
            '<td><span class="badge bg-danger">PDF</span> ' + esc(f.name) + "</td><td>" + (f.buf.byteLength / 1024).toFixed(1) + " KB</td></tr>";
        });
        html += '</tbody></table></div><button class="btn btn-success" onclick="runCheck()">Step 3: Check selected certificates</button></div></div>';
      }
      document.getElementById("panel").innerHTML = html;
    }

    async function connect() {
      document.getElementById("dmsg").innerHTML = '<div class="alert alert-info">Signing in with Google and reading folder...</div>';
      await sleep(1000);
      D.on = true;
      document.getElementById("dmsg").innerHTML = "";
      draw();
    }
    function toggle(i) { const n = driveFiles()[i].name; D.sel[n] = !D.sel[n]; }
    function selectAll() {
      const f = driveFiles();
      const all = f.every(function (x) { return D.sel[x.name]; });
      f.forEach(function (x) { D.sel[x.name] = !all; });
      draw();
    }
    async function addFiles(e) {
      for (const f of e.target.files) D.extra.push({ name: f.name, buf: await f.arrayBuffer() });
      draw();
    }

    // ---------- Check selected files ----------
    async function runCheck() {
      const files = driveFiles().filter(function (f) { return D.sel[f.name]; });
      const msg = document.getElementById("dmsg");
      if (!files.length) { msg.innerHTML = '<div class="alert alert-danger">Select at least one file from the folder.</div>'; return; }

      const certs = DB.get("certificates", []);
      const logs = DB.get("logs", []);
      const R = [];

      for (const f of files) {
        msg.innerHTML = '<div class="alert alert-info">Checking ' + esc(f.name) + " (" + (R.length + 1) + "/" + files.length + ")...</div>";
        await sleep(450);

        const h = await sha256Hex(f.buf);
        const match = certs.find(function (c) { return c.hash === h; });
        const claimed = (f.name.match(/CERT\d+/i) || [])[0];
        const cc = match || certs.find(function (c) { return claimed && c.id.toLowerCase() === claimed.toLowerCase(); });
        const status = match ? "VERIFIED" : (cc ? "TAMPERED" : "NOTFOUND");

        const checks = [
          ["SHA-256 hash computed", true],
          ["Record exists on blockchain", !!cc],
          ["File hash matches blockchain hash", !!match],
          ["Issued by authorized university address", !!cc && cc.issuer === ISSUER_ADDRESS],
          ["Student record found", !!cc && !!findStudent(cc.studentId)],
          ["Issue date is valid (not in future)", !!cc && new Date(cc.date) <= new Date()]
        ];
        R.push({ name: f.name, h: h, status: status, cc: cc, checks: checks });

        logs.push({
          id: logs.length + 1,
          certId: cc ? cc.id : (claimed || "-").toUpperCase(),
          by: me ? me.email : "public",
          time: new Date().toLocaleString(),
          uploadedHash: h,
          blockchainHash: cc ? cc.hash : "-",
          status: status
        });
      }
      DB.set("logs", logs);
      msg.innerHTML = "";
      D.res = R;
      showResults();
    }

    function showResults() {
      const R = D.res;
      if (!R) return;
      const n = function (s) { return R.filter(function (r) { return r.status === s; }).length; };
      const COLOR = { VERIFIED: "success", TAMPERED: "danger", NOTFOUND: "warning" };
      const LABEL = { VERIFIED: "VERIFIED", TAMPERED: "TAMPERED", NOTFOUND: "NOT REGISTERED" };

      let html = '<h4 class="mt-4">Results</h4><div class="row g-3 mb-3">' +
        '<div class="col-6 col-lg-3"><div class="card stat-card"><div class="card-body"><div class="stat-num">' + R.length + '</div><div class="small text-secondary">Files checked</div></div></div></div>' +
        '<div class="col-6 col-lg-3"><div class="card stat-card"><div class="card-body"><div class="stat-num">' + n("VERIFIED") + '</div><div class="small text-secondary">Valid</div></div></div></div>' +
        '<div class="col-6 col-lg-3"><div class="card stat-card stat-red"><div class="card-body"><div class="stat-num">' + n("TAMPERED") + '</div><div class="small text-secondary">Tampered</div></div></div></div>' +
        '<div class="col-6 col-lg-3"><div class="card stat-card stat-red"><div class="card-body"><div class="stat-num">' + n("NOTFOUND") + '</div><div class="small text-secondary">Not registered (possible fake)</div></div></div></div></div>';

      R.forEach(function (r) {
        let text;
        if (r.status === "VERIFIED") text = "Matches <b>" + esc(r.cc.id) + "</b> issued to " + esc((findStudent(r.cc.studentId) || {}).name || "-") + " (" + esc(r.cc.type) + ").";
        else if (r.status === "TAMPERED") text = "Claims to be <b>" + esc(r.cc.id) + "</b> but the file was changed after issue.";
        else text = "No matching record on the blockchain. This certificate was not issued through CertiChain.";

        html += '<div class="card border-' + COLOR[r.status] + ' mb-3"><div class="card-body">' +
          '<div class="d-flex justify-content-between flex-wrap gap-2"><b>' + esc(r.name) + '</b><span class="badge bg-' + COLOR[r.status] + '">' + LABEL[r.status] + "</span></div>" +
          '<div class="mono-dark">' + r.h + '</div><div class="mb-2">' + text + '</div><div class="row g-1 small">';
        r.checks.forEach(function (c) {
          html += '<div class="col-md-6 ' + (c[1] ? "text-success" : "text-danger") + '">' + (c[1] ? "&#10004; " : "&#10008; ") + c[0] + "</div>";
        });
        html += "</div></div></div>";
      });

      if (me && (me.role === "ADMIN" || me.role === "VERIFIER")) {
        html += '<a class="btn btn-outline-secondary" href="history.html">View verification history</a>';
      }
      document.getElementById("results").innerHTML = html;
    }

    draw();
  </script>
</body>
</html>
