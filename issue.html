<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue Certificate - CertiChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar"></div>

  <section class="py-4">
    <div class="container">
      <h2 class="mb-1">Issue Certificate</h2>
      <p class="text-secondary">Next certificate ID: <b id="nextId"></b></p>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card"><div class="card-body">
            <form id="issueForm" novalidate>
              <div class="mb-3">
                <label for="student" class="form-label">Student</label>
                <select class="form-select" id="student"></select>
                <div class="invalid-feedback">Please select a student.</div>
              </div>
              <div class="mb-3">
                <label for="type" class="form-label">Certificate type</label>
                <select class="form-select" id="type">
                  <option>Degree Certificate</option>
                  <option>Provisional Certificate</option>
                  <option>Marksheet</option>
                  <option>Course Completion</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="date" class="form-label">Issue date</label>
                <input type="date" class="form-control" id="date">
                <div class="invalid-feedback">Issue date is required.</div>
              </div>
              <div class="mb-3">
                <label for="file" class="form-label">Certificate PDF</label>
                <input type="file" class="form-control" id="file" accept="application/pdf">
                <div class="form-text">No file? A sample PDF is created for the demo. Max size 1.5 MB.</div>
                <div class="invalid-feedback" id="fileError">Only PDF files are allowed.</div>
              </div>
              <button type="submit" class="btn btn-success w-100" id="issueBtn">Generate hash and register on blockchain</button>
            </form>
          </div></div>
        </div>

        <div class="col-lg-6">
          <div id="progress"></div>
          <div id="result"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="certi-foot text-center py-3">
    Developed by Prahalad Sah | 2K24CSUN01189 | Manav Rachna University
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const user = requireRole("ADMIN");

    if (user) {
      renderAdminNav("issue.html");

      // Fill student dropdown
      const select = document.getElementById("student");
      DB.get("students", []).forEach(function (s) {
        select.innerHTML += '<option value="' + s.id + '">' + s.name + " - " + s.roll + "</option>";
      });
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      showNextId();

      document.getElementById("issueForm").addEventListener("submit", issueCertificate);
    }

    function showNextId() {
      document.getElementById("nextId").textContent = "CERT" + (1001 + DB.get("certificates", []).length);
    }

    async function issueCertificate(e) {
      e.preventDefault();
      const progress = document.getElementById("progress");
      const result = document.getElementById("result");
      result.innerHTML = "";
      progress.innerHTML = "";

      const studentId = document.getElementById("student").value;
      const type = document.getElementById("type").value;
      const date = document.getElementById("date").value;
      const file = document.getElementById("file").files[0];

      // Validation
      const studentOk = studentId !== "";
      const dateOk = date !== "";
      let fileOk = true;
      if (file) {
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        if (!isPdf) { fileOk = false; document.getElementById("fileError").textContent = "Only PDF files are allowed."; }
        else if (file.size > 1.5 * 1024 * 1024) { fileOk = false; document.getElementById("fileError").textContent = "File is too large (max 1.5 MB)."; }
      }
      document.getElementById("student").classList.toggle("is-invalid", !studentOk);
      document.getElementById("date").classList.toggle("is-invalid", !dateOk);
      document.getElementById("file").classList.toggle("is-invalid", !fileOk);
      if (!studentOk || !dateOk || !fileOk) return;

      document.getElementById("issueBtn").disabled = true;
      const student = findStudent(studentId);

      // Step 1: get the file bytes and compute SHA-256
      progress.innerHTML = '<div class="alert alert-info">Step 1/3: Reading file and computing SHA-256 hash...</div>';
      await sleep(600);
      let buffer;
      if (file) buffer = await file.arrayBuffer();
      else buffer = makeSamplePdf(type + " - " + student.name + " (" + student.roll + ") - " + student.university + " - " + date);
      const hash = await sha256Hex(buffer);

      // Same file cannot be registered twice
      const certs = DB.get("certificates", []);
      const duplicate = certs.find(function (c) { return c.hash === hash; });
      if (duplicate) {
        progress.innerHTML = '<div class="alert alert-danger">This exact file is already registered as <b>' + duplicate.id + "</b>.</div>";
        document.getElementById("issueBtn").disabled = false;
        return;
      }

      // Step 2: send to blockchain (simulated)
      progress.innerHTML = '<div class="alert alert-info">Step 2/3: Hash = <span class="mono-dark">' + hash.slice(0, 24) + "...</span><br>Step 3/3: Sending transaction to CertificateRegistry contract...</div>";
      await sleep(1200);

      const cert = {
        id: "CERT" + (1001 + certs.length),
        studentId: studentId,
        type: type,
        date: date,
        fileName: file ? file.name : "CERT" + (1001 + certs.length) + ".pdf",
        fileData: bufferToBase64(buffer),
        hash: hash,
        tx: randomTxHash(),
        block: certs.length + 1,
        issuer: ISSUER_ADDRESS,
        status: "CONFIRMED",
        created: new Date().toLocaleString()
      };
      certs.push(cert);
      try {
        DB.set("certificates", certs);
      } catch (err) {
        progress.innerHTML = '<div class="alert alert-danger">Browser storage is full. Use a smaller PDF.</div>';
        document.getElementById("issueBtn").disabled = false;
        return;
      }

      // Show result
      progress.innerHTML = '<div class="alert alert-success"><b>' + cert.id + "</b> registered on blockchain. Block #" + cert.block + "</div>";
      result.innerHTML =
        '<div class="card"><div class="card-body">' +
        "<h5>Certificate details</h5>" +
        '<dl class="row mb-0">' +
        '<dt class="col-sm-4">Certificate ID</dt><dd class="col-sm-8">' + cert.id + "</dd>" +
        '<dt class="col-sm-4">Student</dt><dd class="col-sm-8">' + student.name + "</dd>" +
        '<dt class="col-sm-4">Type</dt><dd class="col-sm-8">' + cert.type + "</dd>" +
        '<dt class="col-sm-4">SHA-256 hash</dt><dd class="col-sm-8 mono-dark">' + cert.hash + "</dd>" +
        '<dt class="col-sm-4">Transaction hash</dt><dd class="col-sm-8 mono-dark">' + cert.tx + "</dd>" +
        '<dt class="col-sm-4">Issuer</dt><dd class="col-sm-8 mono-dark">' + cert.issuer + "</dd>" +
        "</dl>" +
        '<a href="issue.html" class="btn btn-outline-secondary btn-sm mt-3">Issue another</a>' +
        "</div></div>";

      document.getElementById("issueForm").reset();
      document.getElementById("date").value = new Date().toISOString().slice(0, 10);
      document.getElementById("issueBtn").disabled = false;
      showNextId();
    }
  </script>
</body>
</html>
