<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Certificates - CertiChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body>

  <div id="navbar"></div>

  <section class="py-4">
    <div class="container">
      <h2 class="mb-3">My Certificates</h2>
      <div id="list"></div>
    </div>
  </section>

  <div class="modal fade" id="qrModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center">
        <div class="modal-header">
          <h5 class="modal-title" id="qrTitle">QR code</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="qrBox" class="d-flex justify-content-center mb-3"></div>
          <div class="mono-dark" id="qrLink"></div>
          <small class="text-secondary">Show this QR to a recruiter. Scanning it opens the verification page.</small>
        </div>
        <div class="modal-footer justify-content-center">
          <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="certi-foot text-center py-3">
    Developed by Prahalad Sah | 2K24CSUN01189 | Manav Rachna University
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    function esc(t) {
      return String(t).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    const user = requireRole("STUDENT");

    if (user) {
      renderStudentNav("my-certificates.html");
      showList();
    }

    function showList() {
      const certs = myCertificates();
      if (certs.length === 0) {
        document.getElementById("list").innerHTML =
          '<div class="alert alert-info">No certificates have been issued to you yet.</div>';
        return;
      }
      let html = "";
      certs.forEach(function (c) {
        html += '<div class="card mb-3"><div class="card-body">' +
          '<div class="d-flex justify-content-between flex-wrap gap-2">' +
          '<div><h5 class="mb-1">' + esc(c.type) + "</h5>" +
          '<div class="mono-dark">ID: ' + esc(c.id) + " | Issued: " + esc(c.date) + "</div>" +
          '<div class="mono-dark">Hash: ' + esc(c.hash.slice(0, 20)) + "...</div>" +
          '<div class="mono-dark">Tx: ' + esc(c.tx.slice(0, 20)) + "...</div></div>" +
          '<div><span class="badge bg-success">' + esc(c.status) + "</span></div></div>" +
          '<div class="mt-3 d-flex gap-2 flex-wrap">' +
          '<button class="btn btn-primary btn-sm" onclick="downloadCert(\'' + esc(c.id) + '\')">Download PDF</button>' +
          '<button class="btn btn-success btn-sm" onclick="showQR(\'' + esc(c.id) + '\')">View QR code</button>' +
          '<button class="btn btn-outline-secondary btn-sm" onclick="copyId(this, \'' + esc(c.id) + '\')">Copy ID</button>' +
          "</div></div></div>";
      });
      document.getElementById("list").innerHTML = html;
    }

    function verifyLink(id) {
      const base = location.href.substring(0, location.href.lastIndexOf("/student/"));
      return base + "/verify.html?id=" + id;
    }

    function showQR(id) {
      const link = verifyLink(id);
      document.getElementById("qrTitle").textContent = "QR code for " + id;
      document.getElementById("qrLink").textContent = link;
      const box = document.getElementById("qrBox");
      box.innerHTML = "";
      new QRCode(box, { text: link, width: 200, height: 200 });
      new bootstrap.Modal(document.getElementById("qrModal")).show();
    }

    function downloadCert(id) {
      const c = myCertificates().find(function (x) { return x.id === id; });
      const blob = new Blob([base64ToBuffer(c.fileData)], { type: "application/pdf" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = c.id + ".pdf";
      a.click();
    }

    function copyId(btn, id) {
      navigator.clipboard.writeText(id);
      btn.textContent = "Copied!";
      setTimeout(function () { btn.textContent = "Copy ID"; }, 1500);
    }
  </script>
</body>
</html>
